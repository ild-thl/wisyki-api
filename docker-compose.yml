version: "3.1" # specify docker-compose version

volumes:
  # Set up with `docker volume create ...`. See docker/README.md for more info.
  pg_comp_ai_volume:
  chroma_data:
  hf_text_inf_data:

services:
  # Starts up a postgres database
  postgres:
    image: postgres:16
    restart: always
    volumes:
      - pg_comp_ai_volume:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT}:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "${PGADMIN_PORT}:80"
    depends_on:
      - postgres

  # Chroma vector database
  chroma:
    image: chromadb/chroma:1.5.5
    restart: unless-stopped
    ports:
      - "${CHROMA_PORT}:8000"
    volumes:
      - chroma_data:/data
    environment:
      - CHROMA_SERVER_AUTHN_CREDENTIALS=${CHROMA_SERVER_AUTHN_CREDENTIALS}
      - CHROMA_SERVER_AUTHN_PROVIDER=${CHROMA_SERVER_AUTHN_PROVIDER}

  # HuggingFace Text Embeddings Inference service
  hf-text-inf:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-latest
    restart: unless-stopped
    command:
      - "--model-id"
      - "${HF_EMBEDDING_MODEL}"
      - "--api-key"
      - "${HF_EMBEDDING_API_KEY}"
      - "--auto-truncate"
    ports:
      - "${HF_TEXT_INF_PORT}:80"
    volumes:
      - "hf_text_inf_data:/data"

  # Runs from the latest release
  comp-ai-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: pascalhuerten/comp-ai-api:latest
    pull_policy: always
    restart: always
    env_file:
      - .env
    volumes:
      - ./data/import:/code/data/import
    ports:
      - "${HOST_PORT}:7680"
    depends_on:
      - postgres
      - chroma
      - hf-text-inf
