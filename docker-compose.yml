volumes:
  postgres_data:
  chroma_data:
  hf_text_inf_data:

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT}:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

  pgadmin:
    image: dpage/pgadmin4
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "${PGADMIN_PORT}:80"
    depends_on:
      - postgres

  chroma:
    image: chromadb/chroma:1.5.5
    restart: unless-stopped
    ports:
      - "${CHROMA_HOST_PORT}:8000"
    volumes:
      - chroma_data:/data
    environment:
      CHROMA_SERVER_AUTHN_CREDENTIALS: ${CHROMA_SERVER_AUTHN_CREDENTIALS}
      CHROMA_SERVER_AUTHN_PROVIDER: ${CHROMA_SERVER_AUTHN_PROVIDER}

  hf-text-inf:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-latest
    restart: unless-stopped
    command:
      - "--model-id"
      - "${HF_EMBEDDING_MODEL}"
      - "--api-key"
      - "${HF_EMBEDDING_API_KEY}"
      - "--auto-truncate"
    ports:
      - "${HF_TEXT_INF_PORT}:80"
    volumes:
      - hf_text_inf_data:/data

  wisyki-api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/code/data
      - ./src:/code/src
      - ./tests:/code/tests:ro
    ports:
      - "${HOST_PORT}:7680"
    depends_on:
      - postgres
      - chroma
      - hf-text-inf

  wisyki-api-worker:
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    command: ["python", "-m", "src.metadata_worker"]
    env_file:
      - .env
    volumes:
      - ./data:/code/data
      - ./src:/code/src
    depends_on:
      - postgres
      - chroma
      - hf-text-inf
